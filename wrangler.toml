# Zygo CMS — Multi-Worker Architecture
#
# This project uses THREE separate Cloudflare Workers.
# Each has its own wrangler.toml in its package directory.
#
# Worker               | Config                                       | Domain (prod)
# ---------------------|----------------------------------------------|----------------------------------
# public-worker        | packages/public-worker/wrangler.toml         | zygodactylstudios.com
# admin-api-worker     | packages/admin-api-worker/wrangler.toml      | api.zygodactylstudios.com
# admin-ui-worker      | packages/admin-ui/wrangler.toml              | admin.zygodactylstudios.com
#
# All workers share:
#   - D1 database:  zygo-cms-db  (id: 488417e7-4ad1-4875-90e9-71a0ac3dbc63)
#   - R2 bucket:    zygo-cms-media
#
# Development:
#   npm run dev        — starts all three workers concurrently
#   npm run build      — builds all three workers
#
# Deployment (run from each package directory):
#   cd packages/public-worker    && wrangler deploy
#   cd packages/admin-api-worker && wrangler deploy
#   cd packages/admin-ui         && wrangler deploy
#
# Migrations (run once against the shared D1 db):
#   npx wrangler d1 migrations apply zygo-cms-db --remote
[[d1_databases]]
binding = "DB"
database_name = "zygo-cms-db"
database_id = "488417e7-4ad1-4875-90e9-71a0ac3dbc63"
migrations_dir = "migrations"

# Zygo CMS — Multi-Worker Architecture
#
# This project uses THREE separate Cloudflare Workers.
# Each has its own wrangler.toml in its package directory.
#
# Worker               | Config                                       | Domain (prod)
# ---------------------|----------------------------------------------|----------------------------------
# public-worker        | packages/public-worker/wrangler.toml         | <domain>
# admin-api-worker     | packages/admin-api-worker/wrangler.toml      | api.<domain>
# admin-ui-worker      | packages/admin-ui/wrangler.toml              | admin.<domain>
#
# All workers share:
#   - D1 database:  zygo-cms-db
#   - R2 bucket:    zygo-cms-media
#
# Development:
#   pnpm run dev       — starts all three workers concurrently
#   pnpm run build     — builds all three workers
#
# Deployment (run from each package directory):
#   pnpm run deploy    — deploys all three workers
#
# Migrations (run once against the shared D1 db):
#   npx wrangler d1 migrations apply zygo-cms-db --remote -c packages/admin-api-worker/wrangler.toml

# Root-level fallback database binding.
# Note: Each worker defines its own wrangler.toml configuration inside packages/
[[d1_databases]]
binding = "DB"
database_name = "zygo-cms-db"
database_id = "488417e7-4ad1-4875-90e9-71a0ac3dbc63"
migrations_dir = "migrations"


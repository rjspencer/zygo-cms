[package]
name = "admin-api-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zygo-core = { path = "../core" }
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
askama = "0.16.1"
ammonia = "4"
base64 = "0.22"
jsonwebtoken = "9"
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

[package]
name = "admin-api-worker"
version = "0.2.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zygo-core = { path = "../core" }
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ammonia = "4"
base64 = "0.22"
rsa = { version = "0.9", default-features = false, features = ["std"] }
sha2 = { version = "0.10", features = ["oid"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
rand = "0.8"

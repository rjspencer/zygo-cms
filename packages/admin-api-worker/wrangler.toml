name = "admin-api-worker"
main = "build/index.js"
compatibility_date = "2024-09-01"


[[d1_databases]]
binding = "DB"
database_name = "zygo-cms-db"
database_id = "1ab6229f-73a6-4760-bff2-8ea41dfecce5"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "zygo-cms-media"

[vars]
ENVIRONMENT = "dev"
PROPELAUTH_AUTH_URL = "https://97543635.propelauthtest.com"
EDGE_TTL_SECONDS = "86400"

[triggers]
crons = ["0 0 * * SUN", "0 * * * *"]

[route]
custom_domains = ["api.zygodactylstudios.com"]

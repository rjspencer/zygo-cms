name = "admin-api-worker"
main = "build/index.js"
compatibility_date = "2024-09-01"
workers_dev = false

routes = [
  { pattern = "api.zygodactylstudios.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "zygo-cms-db"
database_id = "488417e7-4ad1-4875-90e9-71a0ac3dbc63"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "zygo-cms-media"

[vars]
ENVIRONMENT = "production"
EDGE_TTL_SECONDS = "86400"
PUBLIC_SUBDOMAIN = "www"
CF_ACCESS_AUD = "f23637f679fd3e3660b63e8218a061c0ed3724aaa5682f6eb9ec9359454b7e84"
CF_ACCESS_TEAM_DOMAIN = "https://zygodactyl-studios.cloudflareaccess.com"

[triggers]
crons = ["0 0 * * SUN", "0 * * * *"]

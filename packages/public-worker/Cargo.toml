[package]
name = "public-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zygo-core = { path = "../core" }
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minijinja = "2.1.1"
ammonia = "4"
base64 = "0.22"

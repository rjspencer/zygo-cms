<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zygo CMS{% endblock %}</title>
    {% block head %}{% endblock %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="alternate" type="application/rss+xml" title="Zygo CMS RSS Feed" href="/rss.xml">
</head>

<body>
    <header>
        <a href="/" class="site-title">Zygo CMS</a>
        <nav class="header-nav">
            <a href="/admin" class="nav-link">Dashboard</a>
            <a href="/admin/editor" class="nav-link">+ New Entry</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>

</html>

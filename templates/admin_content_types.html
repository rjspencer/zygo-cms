{% extends "admin_base.html" %}
{% block content %}

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h2>Content Types</h2>
    <button id="btn-save" class="btn-primary">Save Content Type</button>
</div>

<div style="display: flex; gap: 2rem;">
    <!-- Sidebar: List of Types -->
    <div style="width: 250px; flex-shrink: 0;">
        <div style="background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem;">
            <h4 style="margin-top: 0;">Types</h4>
            <ul id="type-list" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.5rem;">
                <li style="color: #64748b;">Loading...</li>
            </ul>
            <button id="btn-new-type" class="btn-secondary" style="margin-top: 1rem; width: 100%;">+ New Type</button>
        </div>
    </div>

    <!-- Main Content: Schema Editor -->
    <div style="flex: 1; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1.5rem;" id="schema-editor-pane">
        <div id="no-selection-msg">Select a content type or create a new one.</div>
        
        <div id="editor-form" style="display: none; flex-direction: column; gap: 1rem;">
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 0.25rem;">Type ID (e.g. 'product')</label>
                <input type="text" id="inp-id" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;" disabled>
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 0.25rem;">Display Name</label>
                <input type="text" id="inp-name" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 0.25rem;">Description</label>
                <input type="text" id="inp-description" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 1rem 0;">
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h4 style="margin: 0;">Custom Fields</h4>
                <button id="btn-add-field" class="btn-secondary" style="font-size: 0.8rem; padding: 0.25rem 0.5rem;">+ Add Field</button>
            </div>

            <div id="fields-container" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <!-- Fields rendered here -->
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://esm.sh/@propelauth/javascript';

    const authUrl = "{{ auth_url }}";
    let authClient = null;
    let token = null;

    let types = [];
    let activeTypeId = null;
    let currentSchema = []; // Array of field objects

    if (authUrl) {
        authClient = createClient({ authUrl, enableBackgroundTokenRefresh: true });
        const info = await authClient.getAuthenticationInfoOrNull();
        if (!info) {
            authClient.redirectToLoginPage();
        } else {
            token = info.accessToken;
            fetchTypes();
        }
    } else {
        fetchTypes();
    }

    async function fetchTypes() {
        try {
            const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
            const res = await fetch('/api/content-types', { headers });
            if (!res.ok) throw new Error("HTTP error " + res.status);
            types = await res.json();
            renderSidebar();
        } catch (e) {
            console.error(e);
            alert("Failed to load content types.");
        }
    }

    function renderSidebar() {
        const list = document.getElementById('type-list');
        list.innerHTML = '';
        types.forEach(t => {
            const li = document.createElement('li');
            li.textContent = t.name;
            li.style.padding = '0.5rem';
            li.style.cursor = 'pointer';
            li.style.borderRadius = '4px';
            li.style.background = activeTypeId === t.id ? '#f1f5f9' : 'transparent';
            li.style.fontWeight = activeTypeId === t.id ? 'bold' : 'normal';
            li.onclick = () => selectType(t.id);
            list.appendChild(li);
        });
    }

    function selectType(id) {
        activeTypeId = id;
        renderSidebar();
        const type = types.find(t => t.id === id);
        
        document.getElementById('no-selection-msg').style.display = 'none';
        document.getElementById('editor-form').style.display = 'flex';
        
        document.getElementById('inp-id').value = type.id;
        document.getElementById('inp-id').disabled = (id === 'post' || id === 'page'); // Disallow changing core IDs, wait, actually we disallow changing ID period for existing ones.
        document.getElementById('inp-id').disabled = true;
        
        document.getElementById('inp-name').value = type.name;
        document.getElementById('inp-description').value = type.description || '';
        
        try {
            currentSchema = JSON.parse(type.schema_json);
        } catch(e) {
            currentSchema = [];
        }
        
        renderFields();
    }

    function renderFields() {
        const container = document.getElementById('fields-container');
        container.innerHTML = '';
        
        if (currentSchema.length === 0) {
            container.innerHTML = '<p style="color:#64748b; font-size: 0.9rem;">No custom fields defined.</p>';
            return;
        }

        currentSchema.forEach((f, idx) => {
            const row = document.createElement('div');
            row.style.display = 'flex';
            row.style.gap = '0.5rem';
            row.style.alignItems = 'center';
            row.style.background = '#f8fafc';
            row.style.padding = '0.5rem';
            row.style.borderRadius = '4px';
            row.style.border = '1px solid #e2e8f0';

            row.innerHTML = `
                <input type="text" placeholder="Field Key (e.g. price)" value="${f.name.replace(/"/g, '&quot;')}" class="f-name" style="flex:1; padding: 0.25rem;">
                <input type="text" placeholder="Label (e.g. Price)" value="${f.label.replace(/"/g, '&quot;')}" class="f-label" style="flex:1; padding: 0.25rem;">
                <select class="f-type" style="flex:1; padding: 0.25rem;">
                    <option value="text" ${f.type === 'text' ? 'selected' : ''}>Text</option>
                    <option value="number" ${f.type === 'number' ? 'selected' : ''}>Number</option>
                    <option value="boolean" ${f.type === 'boolean' ? 'selected' : ''}>Boolean</option>
                    <option value="date" ${f.type === 'date' ? 'selected' : ''}>Date</option>
                </select>
                <label style="font-size: 0.8rem; display:flex; align-items:center; gap:0.25rem;"><input type="checkbox" class="f-req" ${f.required ? 'checked' : ''}> Req</label>
                <button class="btn-icon btn-del" style="cursor:pointer; background:none; border:none;" title="Remove">🗑️</button>
            `;
            
            row.querySelector('.f-name').addEventListener('input', e => f.name = e.target.value);
            row.querySelector('.f-label').addEventListener('input', e => f.label = e.target.value);
            row.querySelector('.f-type').addEventListener('change', e => f.type = e.target.value);
            row.querySelector('.f-req').addEventListener('change', e => f.required = e.target.checked);
            row.querySelector('.btn-del').addEventListener('click', () => {
                currentSchema.splice(idx, 1);
                renderFields();
            });

            container.appendChild(row);
        });
    }

    document.getElementById('btn-add-field').addEventListener('click', () => {
        currentSchema.push({ name: 'new_field', label: 'New Field', type: 'text', required: false });
        renderFields();
    });

    document.getElementById('btn-new-type').addEventListener('click', () => {
        const id = prompt("Enter new type ID (lowercase, no spaces, e.g. 'product'):");
        if (!id) return;
        if (types.find(t => t.id === id)) {
            alert("Type ID already exists!");
            return;
        }
        
        types.push({
            id: id,
            name: 'New ' + id,
            description: '',
            schema_json: '[]'
        });
        selectType(id);
        
        // For new types, allow editing the ID field?
        // Let's just lock it to the prompt.
        document.getElementById('inp-id').value = id;
    });

    document.getElementById('btn-save').addEventListener('click', async () => {
        if (!activeTypeId) return;
        
        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.textContent = 'Saving...';
        
        const id = document.getElementById('inp-id').value;
        const name = document.getElementById('inp-name').value;
        const description = document.getElementById('inp-description').value;
        
        const payload = {
            name,
            description,
            schema_json: JSON.stringify(currentSchema)
        };

        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;

        try {
            const res = await fetch('/api/content-types/' + encodeURIComponent(id), {
                method: 'PUT',
                headers,
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                btn.textContent = 'Saved!';
                
                // Update local memory
                const type = types.find(t => t.id === id);
                type.name = name;
                type.description = description;
                type.schema_json = JSON.stringify(currentSchema);
                renderSidebar();
                
                setTimeout(() => { btn.textContent = 'Save Content Type'; btn.disabled = false; }, 2000);
            } else {
                const err = await res.json();
                alert("Error saving: " + err.error);
                btn.textContent = 'Save Content Type'; btn.disabled = false;
            }
        } catch (e) {
            alert("Network error");
            btn.textContent = 'Save Content Type'; btn.disabled = false;
        }
    });
</script>
{% endblock %}

<header style="flex-wrap: wrap; gap: 1rem;">
    <a href="/" class="site-title">Zygo CMS</a>
    
    <div style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 1.5rem;">
        <nav class="header-nav">
            {{ crate::models::menu::render_menu_html(header_menu, 0)|safe }}
        </nav>
        
        <div style="position: relative;">
            <form action="/search" method="GET" style="display: flex; align-items: center; gap: 0.5rem; margin: 0;">
                <input 
                    type="search" 
                    name="q" 
                    id="site-search-input"
                    placeholder="Search..." 
                    autocomplete="off"
                    style="padding: 0.35rem 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; width: 200px;"
                >
                <button type="submit" style="display: none;">Search</button>
            </form>
            <div id="search-autocomplete-results" style="display: none; position: absolute; top: 100%; right: 0; width: 300px; background: white; border: 1px solid #eaeaea; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 0.5rem; z-index: 50; padding: 0.5rem 0; font-size: 0.85rem;">
            </div>
        </div>
    </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('site-search-input');
    const resultsContainer = document.getElementById('search-autocomplete-results');
    let timeoutId;
    let currentQuery = '';

    input.addEventListener('input', (e) => {
        clearTimeout(timeoutId);
        const query = e.target.value.trim();
        currentQuery = query;
        
        if (!query) {
            resultsContainer.style.display = 'none';
            return;
        }

        timeoutId = setTimeout(async () => {
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error('Search failed');
                const data = await res.json();
                
                // Prevent race condition if user typed more while waiting
                if (currentQuery !== query) return;
                
                resultsContainer.innerHTML = '';
                
                if (data.length === 0) {
                    resultsContainer.innerHTML = '<div style="padding: 0.5rem 1rem; color: #888;">No results found</div>';
                } else {
                    data.forEach(item => {
                        const link = document.createElement('a');
                        const path = item.path ? item.path : (item.type === 'page' ? '/' + item.slug : '/post/' + item.slug);
                        link.href = path;
                        link.style.display = 'block';
                        link.style.padding = '0.5rem 1rem';
                        link.style.color = '#1a1a1a';
                        link.style.textDecoration = 'none';
                        link.style.fontFamily = 'var(--font-headline)';
                        
                        const strong = document.createElement('strong');
                        strong.textContent = item.title;
                        link.appendChild(strong);
                        
                        link.addEventListener('mouseover', () => {
                            link.style.backgroundColor = '#f5f5f5';
                        });
                        link.addEventListener('mouseout', () => {
                            link.style.backgroundColor = 'transparent';
                        });
                        
                        resultsContainer.appendChild(link);
                    });
                    
                    const viewAll = document.createElement('a');
                    viewAll.href = `/search?q=${encodeURIComponent(query)}`;
                    viewAll.style.display = 'block';
                    viewAll.style.padding = '0.5rem 1rem';
                    viewAll.style.color = '#555';
                    viewAll.style.textDecoration = 'underline';
                    viewAll.style.fontFamily = 'var(--font-headline)';
                    viewAll.style.textAlign = 'center';
                    viewAll.style.borderTop = '1px solid #eaeaea';
                    viewAll.style.marginTop = '0.25rem';
                    viewAll.innerHTML = `View all results &rarr;`;
                    resultsContainer.appendChild(viewAll);
                }
                
                resultsContainer.style.display = 'block';
            } catch (err) {
                console.error(err);
            }
        }, 300);
    });

    document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !resultsContainer.contains(e.target)) {
            resultsContainer.style.display = 'none';
        }
    });
    
    input.addEventListener('focus', () => {
        if (input.value.trim() && resultsContainer.innerHTML) {
            resultsContainer.style.display = 'block';
        }
    });
});
</script>

<!-- Dynamically injects Vite live-reload scripts only during local development -->
<script>
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        document.write('<script type="module" src="http://localhost:5173/@vite/client"><\\/script>');
        document.write('<script type="module" src="http://localhost:5173/src/style.css"><\\/script>');
    }
</script>

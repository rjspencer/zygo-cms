name: Deploy Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install worker-build
        run: cargo install worker-build --locked

      - name: Run Rust Unit Test Suite
        run: cargo test --lib

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS Dependencies
        run: |
          npm ci
          npm ci --prefix packages/admin-ui

      - name: Run Browser / DOM Test Suite
        run: npm test

  deploy:
    name: Build & Deploy
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install worker-build
        run: cargo install worker-build --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS Dependencies
        run: |
          npm ci
          npm ci --prefix packages/admin-ui

      - name: Inject API URL for UI Build
        run: |
          API_DOMAIN=$(grep -oE 'pattern = "[^"]+"' packages/admin-api-worker/wrangler.toml | head -n 1 | cut -d'"' -f2)
          echo "VITE_API_BASE_URL=https://$API_DOMAIN" >> packages/admin-ui/.env.production

      - name: Build All Packages
        run: npm run build

      - name: Create D1 Database (if not exists)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 create zygo-cms-db
        continue-on-error: true  # Succeeds even if DB already exists

      - name: Apply D1 Database Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/public-worker
          command: d1 migrations apply zygo-cms-db --remote

      - name: Deploy Public Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/public-worker

      - name: Deploy Admin API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/admin-api-worker

      - name: Deploy Admin UI
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/admin-ui

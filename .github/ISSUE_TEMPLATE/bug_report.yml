name: Bug Report
description: Report a bug or unexpected behavior in Zygo CMS
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Component / Package
      options:
        - admin-ui (React SPA)
        - admin-api-worker (REST API / Auth)
        - public-worker (SSR / Edge Cache / Templates)
        - zygo-core (Shared Models / DB)
        - template-wasm (Live Preview Wasm)
        - zygo-mcp / WebMCP (AI Agent Tools)
        - create-zygo-app / Setup CLI
        - Documentation / Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any console errors, Wrangler output, or screenshots.
      render: shell
